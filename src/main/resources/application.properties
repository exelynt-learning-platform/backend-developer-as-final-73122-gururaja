spring.application.name=booking

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/booking_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# The secret key must be at least 256 bits (32 bytes) long.
jwt.secret=${JWT_SECRET:mySecretKeyForBookingSystemMustBeAtLeast256BitsLongAndSecure!}
# Expiration: 24 hours (86,400,000 milliseconds)
jwt.expiration=86400000

# OpenApi / Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
