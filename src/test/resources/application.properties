spring.application.name=booking-test

# Database Configuration for Tests (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:booking_system;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForBookingSystemMustBeAtLeast256BitsLongAndSecure!}
jwt.expiration=86400000
